---
name: DB Refresh

# Daily rebuild of the Docker image with the latest kubesearch databases
# from whazor/k8s-at-home-search. The reusable docker-build.yml workflow
# handles the actual build + push; this workflow just supplies a daily-
# changing build-arg to bust the DB layer cache and chooses the tag set.
#
# Upstream publishes daily between 03:40 and 04:35 UTC; 05:30 UTC gives a
# ~1-hour buffer so the refresh always sees the current day's release.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

# If a run is delayed or two dispatches overlap, keep only the latest.
concurrency:
  group: db-refresh
  cancel-in-progress: true

jobs:
  prep:
    name: Compute daily refresh tag
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.d.outputs.date }}
    steps:
      - name: UTC date for cache busting
        id: d
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  refresh:
    name: Rebuild image with latest kubesearch DBs
    needs: prep
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      push: true
      platforms: linux/amd64,linux/arm64
      build-args: DB_REFRESH_DATE=${{ needs.prep.outputs.date }}
      tag-rules: |
        type=raw,value=latest
        type=raw,value=db-{{date 'YYYYMMDD'}}
